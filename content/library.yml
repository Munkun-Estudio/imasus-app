- id: b-zornoza-chitosan
  item_type: material
  published: true
  translations:
    en:
      title: B.Zornoza- Chitosan
      summary: Chitosan is an innovative biopolymer derived from the shells of crustaceans — a natural material being reimagined for the future of fashion. Through a process of transformation, it forms a delicate yellowish membrane with exciting potential in textiles. Still in the early stages of development, chitosan invites bold designers to explore new possibilities at the intersection of science and style. It's not just a material — it's a glimpse into what sustainable fashion could become.
  fields:
    material_of_origin: Chitosan
    availability_status: research_only
    interesting_properties:
      en: This forward-thinking project was developed by Beatriz Zonorza, a researcher in the Chemical Engineering Department at the University of Zaragoza. Her work brings science and sustainability together, opening new doors for innovative materials.
    structure:
      en: Smooth material which is not composed of fibres, since it is a sheet not obtained by the use of fabric or yarn. In the ESEM images, small defects of unknown composition are visible.
    what_problem_it_solves:
      en: Chitosan’s unique membrane-like texture and plastic-like feel make it a promising natural alternative to petroleum-based plastics. It could be used to create sustainable clothing and accessories such as raincoats or bags, offering eco-friendly options that reduce reliance on traditional plastics while maintaining durability and functionality.
  taxonomies:
    origin_type:
    - animals
  links: []
  assets: []
