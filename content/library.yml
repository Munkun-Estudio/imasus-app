- id: econyl-catalogue
  item_type: material
  published: true
  translations:
    en:
      title: Econyl catalogue
      summary: Econyl is more than just a fabric — it’s a chance to design with purpose. Made from recycled industrial and post-consumer waste, Econyl offers the same strength and versatility as traditional nylon, but with a far lighter impact on the planet. Available in a wide range of colors and patterns, it gives fashion students the freedom to create boldly while supporting a circular future. With Econyl, sustainability and style go hand in hand.
  fields:
    supplier_name: Econyl
    supplier_url: https://econyl.aquafil.com/
    material_of_origin: Recycled nylon
    availability_status: commercial
    interesting_properties:
      en: Offering the same performance as virgin nylon, it’s just as durable, flexible, and waterproof — ready to meet the demands of modern design. For fashion students, it’s an invitation to innovate responsibly, blending high performance with low impact.
    structure:
      en: 'Econyl HEE 421, Econyl HDE 101, Econyl HCE406, Econyl EFX004: Disordered filaments of the same size (threads). Econyl-3600-92AE: Clustered filaments, composed of three different types of fibres as they have different thicknesses.'
    what_problem_it_solves:
      en: Econyl tackles the growing problem of plastic waste by turning it into a valuable resource. Made from discarded fishing nets, fabric scraps, and other nylon waste, it helps reduce pollution in oceans and landfills. At the same time, it offers designers a sustainable alternative to virgin nylon, without sacrificing quality or performance. Econyl supports a circular fashion model, where materials are reused instead of wasted.
  taxonomies:
    origin_type:
