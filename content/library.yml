      summary: Crabyon Viscose yarn is made from natural cellulose and enriched with chitin, giving it antibacterial and hypoallergenic qualities. Its blend can be adjusted and combined with cotton or wool, offering endless possibilities.This is a reminder that innovation in materials allows us to create fabrics that are healthy, and sustainable.
  fields:
