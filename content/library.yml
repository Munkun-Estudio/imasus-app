    material_of_origin: Chitosan
    availability_status: commercial
    interesting_properties:
      en: This substance comes from recycling of the shellfish carapace through a particular production process, patented worldwide. Chitosan is the world’s second most abundant polymer and its derivative chitin has a similar structure to cellulose.
    what_problem_it_solves:
      en: By using chitin derived from shellfish waste, it reduces industrial waste and promotes the recycling of natural resources. Its antibacterial and hypoallergenic properties make it ideal for healthier textiles, reducing the need for chemical treatments. Additionally, the fibre can be blended with cotton, wool, or other materials, allowing designers to create sustainable, functional, and innovative fabrics while supporting a more circular and eco-conscious textile industry.
