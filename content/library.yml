  item_type: material
  published: true
  translations:
    en:
      title: Lifematerials - Kapok
      summary: Kapok is a material born from the seeds of the Ceiba tree — nature’s own masterpiece of softness and strength. Composed of hollow cellulose fibres, it feels almost weightless against the skin, like wearing air. Its delicate touch hides powerful insulating properties, offering warmth without bulk. Light, breathable, and beautifully organic, Kapok invites designers to explore a new kind of elegance — one that’s rooted in nature and crafted for comfort.
  fields:
    supplier_name: LifeMaterials
    supplier_url: https://lifematerials.eu/shop/life-materials-full-kit/
    material_of_origin: Kapok
    availability_status: commercial
    interesting_properties:
      en: Naturally odourless, non-toxic, and hypoallergenic, it offers comfort even to the most sensitive skin. Its hollow fibre structure not only provides exceptional insulation — it also makes the material incredibly buoyant, able to support up to 30 times its own weight. Even after 30 days, it retains 90% of its buoyancy, making it an ideal choice for life-saving designs like life jackets. With Kapol, safety meets softness, and innovation stays beautifully natural.
    structure:
      en: Numerous filaments in no order. Scattered filaments.
    what_problem_it_solves:
      en: Kapok solves the problem of finding a natural, lightweight, and breathable stuffing material. Unlike synthetic fibers, kapok is eco-friendly and biodegradable, making it a sustainable choice. Its softness and ability to resist moisture help create comfortable pillows and cushions that stay cool and dry.
