name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Strip private git gems
        run: sed -i '/munkit/d' Gemfile && rm -f Gemfile.lock

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_FROZEN: "false"
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Strip private git gems
        run: sed -i '/munkit/d' Gemfile && rm -f Gemfile.lock

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_FROZEN: "false"
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Strip private git gems
        run: sed -i '/munkit/d' Gemfile && rm -f Gemfile.lock

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_FROZEN: "false"
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    name: test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - imasus
          - minimal

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y imagemagick libpq-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Strip private git gems
        run: sed -i '/munkit/d' Gemfile && rm -f Gemfile.lock

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_FROZEN: "false"
        with:
          bundler-cache: true

      - name: Validate installation profile
        env:
          APP_PROFILE: ${{ matrix.profile }}
        run: bin/site-config

      - name: Prepare test database
        env:
          APP_PROFILE: ${{ matrix.profile }}
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails db:test:prepare

      - name: Run IMASUS compatibility suite
        if: matrix.profile == 'imasus'
        env:
          APP_PROFILE: imasus
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails test

      - name: Build Tailwind for minimal-profile smoke test
        if: matrix.profile == 'minimal'
        env:
          APP_PROFILE: minimal
          RAILS_ENV: test
        run: bin/rails tailwindcss:build

      - name: Run minimal-profile smoke test
        if: matrix.profile == 'minimal'
        env:
          APP_PROFILE: minimal
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails test test/integration/minimal_profile_test.rb

      - name: Compile assets for installation profile
        env:
          APP_PROFILE: ${{ matrix.profile }}
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: "1"
        run: bin/rails assets:precompile

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y imagemagick libpq-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Strip private git gems
        run: sed -i '/munkit/d' Gemfile && rm -f Gemfile.lock

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_FROZEN: "false"
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
